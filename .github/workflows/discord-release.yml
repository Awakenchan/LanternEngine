name: Discord release notice

# Posts every published release to Discord: pre-releases to the beta channel, the rest to the
# stable one. The webhook URLs are repository secrets (DISCORD_WEBHOOK_BETA, DISCORD_WEBHOOK_STABLE).
# Long notes go out as several messages of one embed each, since Discord allows 4096 characters
# in an embed and 6000 in a message; the last one links the full notes on GitHub.
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ github.event.release.prerelease && secrets.DISCORD_WEBHOOK_BETA || secrets.DISCORD_WEBHOOK_STABLE }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TITLE: ${{ github.event.release.name || github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No webhook secret for this channel"; exit 0; fi
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          LIMIT = 3800
          pre = os.environ["PRERELEASE"] == "true"
          title, url = os.environ["TITLE"], os.environ["URL"]
          closing = f"\n\nFull notes and download: [GitHub release]({url})"

          chunks, current = [], ""
          for line in os.environ["BODY"].replace("\r\n", "\n").split("\n"):
              while len(line) > LIMIT:
                  if current:
                      chunks.append(current)
                      current = ""
                  chunks.append(line[:LIMIT])
                  line = line[LIMIT:]
              if current and len(current) + len(line) + 1 > LIMIT:
                  chunks.append(current)
                  current = line
              else:
                  current = f"{current}\n{line}" if current else line
          if current.strip() or not chunks:
              chunks.append(current)
          chunks = [c.strip("\n") for c in chunks if c.strip()] or [""]

          for index, text in enumerate(chunks):
              last = index == len(chunks) - 1
              embed = {
                  "title": title if len(chunks) == 1 else f"{title} ({index + 1}/{len(chunks)})",
                  "url": url,
                  "description": text + (closing if last else ""),
                  "color": 15105570 if pre else 10038562,
              }
              if last:
                  embed["footer"] = {"text": "Beta: not tested yet" if pre else "Stable release"}
              message = {"username": "Bloodborne PC", "embeds": [embed]}
              if index == 0:
                  role = "1566302090169417788" if pre else "1566302050172539031"
                  message["content"] = f"<@&{role}>"
                  message["allowed_mentions"] = {"roles": [role]}
              payload = json.dumps(message).encode()
              if os.environ.get("DISCORD_DRY_RUN"):
                  print(index + 1, len(chunks), len(embed["description"]), len(embed["title"]), repr(text[:40]))
                  continue
              for attempt in range(5):
                  request = urllib.request.Request(os.environ["WEBHOOK"], data=payload, headers={
                      "Content-Type": "application/json", "User-Agent": "LanternEngine-release-notice"})
                  try:
                      urllib.request.urlopen(request).read()
                      break
                  except urllib.error.HTTPError as error:
                      if error.code != 429 or attempt == 4:
                          raise
                      time.sleep(float(json.loads(error.read()).get("retry_after", 2)) + 0.5)
              time.sleep(1)
          PY
