name: Linux build and test

# Builds the engine on Linux in the Docker environment of engine/packaging/linux (the same one
# docker-build.sh uses locally). The environment's image is cached between runs, so only a change
# to the Dockerfile or setup-ubuntu.sh rebuilds the dependencies.
on:
  pull_request:
    paths:
      - "engine/**"
      - "!engine/docs/**"
      - ".github/workflows/linux-build.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "!engine/docs/**"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build environment image
        uses: docker/build-push-action@v6
        with:
          context: engine/packaging/linux
          tags: lantern-build
          load: true
          cache-from: type=gha,scope=lantern-build
          cache-to: type=gha,scope=lantern-build,mode=max

      # Fast gate: no link-time optimization or PGO (a compile, link and test check, not a
      # release). Tests that need the game's files or a room server report SKIPPED.
      - name: Build and test engine
        env:
          LANTERN_SKIP_IMAGE: "1"
          BB_GATE: fast
        run: engine/packaging/linux/docker-build.sh --test

      - name: List outputs
        run: ls -la engine/out engine/out/gpu
